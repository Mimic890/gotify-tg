services:
  gotify-tg:
    build: .
    image: gotify-tg:local
    container_name: gotify-tg
    restart: unless-stopped
    environment:
      GOTIFY_URL: ${GOTIFY_URL:?set GOTIFY_URL in .env}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:?set TELEGRAM_CHAT_ID in .env}
      MIN_PRIORITY: ${MIN_PRIORITY:-0}
      APP_IDS: ${APP_IDS:-}
      ALLOW_INSECURE_GOTIFY: ${ALLOW_INSECURE_GOTIFY:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      GOTIFY_CLIENT_TOKEN_FILE: /run/secrets/gotify_client_token
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      DATA_DIR: /data
    secrets:
      - gotify_client_token
      - telegram_bot_token
    volumes:
      - ./data:/data
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 64
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "/gotify-tg", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  gotify_client_token:
    file: ./secrets/gotify_client_token
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
